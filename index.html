<!DOCTYPE html>
<html>
<head>

<title>Career Compass</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fa;
}

header{
width:100%;
height:80px;
background:#0f172a;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 80px;
position:fixed;
top:0;
left:0;
z-index:1000;
}

.logo{
font-size:32px;
font-weight:bold;
color:white;
letter-spacing:1px;
}

nav ul{
display:flex;
list-style:none;
}

nav ul li{
margin-left:30px;
}

nav ul li a{
text-decoration:none;
color:white;
font-size:17px;
transition:.3s;
}

nav ul li a:hover{
color:#38bdf8;
}

.login{
background:#2563eb;
padding:10px 22px;
border-radius:25px;
}

.hero{
margin-top:80px;
display:flex;
justify-content:space-between;
align-items:center;
padding:80px;
background:linear-gradient(135deg,#e0f2fe,#f8fafc);
min-height:90vh;
}

.left{
width:50%;
}

.left h1{
font-size:60px;
color:#0f172a;
margin-bottom:20px;
}

.left span{
color:#2563eb;
}

.left p{
font-size:20px;
line-height:34px;
color:#475569;
margin-bottom:35px;
}

.search-box{
width:500px;
height:60px;
background:white;
border-radius:50px;
display:flex;
align-items:center;
padding:0 20px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.search-box input{
width:100%;
border:none;
outline:none;
font-size:17px;
}

.search-box i{
font-size:20px;
color:#2563eb;
margin-right:15px;
}

.buttons{
margin-top:35px;
}

.btn1{
display:inline-block;
padding:15px 35px;
background:#2563eb;
color:white;
text-decoration:none;
border-radius:10px;
margin-right:15px;
}

.btn2{
display:inline-block;
padding:15px 35px;
border:2px solid #2563eb;
color:#2563eb;
text-decoration:none;
border-radius:10px;
}

.right img{
width:550px;
}

</style>

</head>

<body>

<header>

<div class="logo">
Career Compass
</div>

<nav>

<ul>

<li><a href="#">Home</a></li>

<li><a href="#">Career</a></li>

<li><a href="#">Companies</a></li>

<li><a href="#">Jobs</a></li>

<li><a href="#">Resume</a></li>

<li><a href="#">Interview</a></li>

<li><a href="#">Contact</a></li>

<li><a href="#" class="login">Login</a></li>

</ul>

</nav>

</header>

<section class="hero">

<div class="left">

<h1>Build Your <span>Dream Career</span></h1>

<p>
Find the best career path, top companies, resume builder,
interview preparation, internships and jobs in one platform.
</p>

<div class="search-box">

<i class="fa-solid fa-magnifying-glass"></i>

<input type="text" placeholder="Search Career, Company or Skill">

</div>

<div class="buttons">

<a href="#" class="btn1">Explore Careers</a>

<a href="#" class="btn2">Get Started</a>

</div>

</div>

<div class="right">

<img src="images/banner.png">

</div>

</section>

</body>
</html>
